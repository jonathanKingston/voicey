[package]
name = "voicey-fetch"
version.workspace = true
edition.workspace = true

[[bin]]
name = "voicey-fetch"
path = "src/main.rs"

[dependencies]
voicey-protocol = { path = "../voicey-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
