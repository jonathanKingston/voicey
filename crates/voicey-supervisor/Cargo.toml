[package]
name = "voicey-supervisor"
version.workspace = true
edition.workspace = true

[[bin]]
name = "voicey-supervisor"
path = "src/main.rs"

[dependencies]
voicey-protocol = { path = "../voicey-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
voicey-pcm = { path = "../voicey-pcm" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
