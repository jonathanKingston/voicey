[package]
name = "voicey-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Text pipeline for Voicey: glossary, BM25 term selection, and cleanup"

[[bin]]
name = "voicey-text"
path = "src/main.rs"

[dependencies]
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
