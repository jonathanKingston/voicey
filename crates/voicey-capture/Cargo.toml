[package]
name = "voicey-capture"
version.workspace = true
edition.workspace = true

[[bin]]
name = "voicey-capture"
path = "src/main.rs"

[dependencies]
voicey-protocol = { path = "../voicey-protocol" }
voicey-pcm = { path = "../voicey-pcm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"

[dev-dependencies]
hound = "3.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
