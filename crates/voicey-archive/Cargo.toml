[package]
name = "voicey-archive"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "voicey-archive"
path = "src/main.rs"

[dependencies]
voicey-pcm = { path = "../voicey-pcm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
