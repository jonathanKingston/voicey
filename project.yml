name: Voicey
options:
  bundleIdPrefix: work.voicey
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    PRODUCT_NAME: Voicey
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    COMBINE_HIDPI_IMAGES: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: "2.0.0"
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.9.0"
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift
    branch: main

targets:
  # App Store / TestFlight target
  Voicey:
    type: application
    platform: macOS
    sources:
      - path: Sources/Voicey
        excludes:
          - "**/.DS_Store"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Sources/Voicey/Resources
        buildPhase: resources
    dependencies:
      - target: VoiceyCoreMac
      - package: KeyboardShortcuts
      - package: WhisperKit
      - package: SpeechSwift
        product: Qwen3ASR
      - package: SpeechSwift
        product: AudioCommon
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: CoreML.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.voicey.Voicey
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Voicey.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    entitlements:
      path: Voicey.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true

  # Direct distribution target (non-sandboxed, has auto-paste)
  VoiceyDirect:
    type: application
    platform: macOS
    sources:
      - path: Sources/Voicey
        excludes:
          - "**/.DS_Store"
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
      - path: Sources/Voicey/Resources
        buildPhase: resources
    dependencies:
      - target: VoiceyCoreMac
      - package: KeyboardShortcuts
      - package: WhisperKit
      - package: SpeechSwift
        product: Qwen3ASR
      - package: SpeechSwift
        product: AudioCommon
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: CoreML.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: work.voicey.VoiceyDirect
        PRODUCT_NAME: Voicey
        INFOPLIST_FILE: Info.direct.plist
        CODE_SIGN_ENTITLEMENTS: VoiceyDirect.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: VOICEY_DIRECT_DISTRIBUTION
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG VOICEY_DIRECT_DISTRIBUTION
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: VOICEY_DIRECT_DISTRIBUTION
    entitlements:
      path: VoiceyDirect.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true

  VoiceyCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/VoiceyCore
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: VoiceyCore
        PRODUCT_MODULE_NAME: VoiceyCore
        PRODUCT_BUNDLE_IDENTIFIER: work.voicey.VoiceyiOS.core
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  VoiceyCoreMac:
    type: framework
    platform: macOS
    sources:
      - path: Sources/VoiceyCore
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: VoiceyCore
        PRODUCT_MODULE_NAME: VoiceyCore
        PRODUCT_BUNDLE_IDENTIFIER: work.voicey.Voicey.core.mac
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  VoiceyKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/VoiceyKeyboardExtension
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: VoiceyCore
    settings:
      base:
        PRODUCT_NAME: VoiceyKeyboardExtension
        PRODUCT_MODULE_NAME: VoiceyKeyboardExtension
        PRODUCT_BUNDLE_IDENTIFIER: work.voicey.VoiceyiOS.keyboard
        INFOPLIST_FILE: Info.KeyboardExtension.plist
        CODE_SIGN_ENTITLEMENTS: VoiceyKeyboardExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    entitlements:
      path: VoiceyKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.work.voicey.shared

  VoiceySpeechApple:
    type: framework
    platform: iOS
    sources:
      - path: Sources/VoiceySpeechApple
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: VoiceyCore
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: VoiceySpeechApple
        PRODUCT_MODULE_NAME: VoiceySpeechApple
        PRODUCT_BUNDLE_IDENTIFIER: work.voicey.VoiceyiOS.speech
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  VoiceyiOSApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/VoiceyiOSApp
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: VoiceyCore
      - target: VoiceySpeechApple
      - target: VoiceyKeyboardExtension
      - sdk: AVFoundation.framework
    settings:
      base:
        PRODUCT_NAME: VoiceyiOS
        PRODUCT_MODULE_NAME: VoiceyiOSApp
        PRODUCT_BUNDLE_IDENTIFIER: work.voicey.VoiceyiOS
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: Info.iOS.plist
        CODE_SIGN_ENTITLEMENTS: VoiceyiOS.entitlements
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    entitlements:
      path: VoiceyiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.work.voicey.shared

schemes:
  Voicey:
    build:
      targets:
        Voicey: all
    run:
      config: Debug
    archive:
      config: Release

  VoiceyDirect:
    build:
      targets:
        VoiceyDirect: all
    run:
      config: Debug
    archive:
      config: Release

  VoiceyiOSApp:
    build:
      targets:
        VoiceyiOSApp: all
        VoiceyCore: all
        VoiceySpeechApple: all
        VoiceyKeyboardExtension: all
    run:
      config: Debug
    archive:
      config: Release

  VoiceyKeyboardExtension:
    build:
      targets:
        VoiceyCore: all
        VoiceyKeyboardExtension: all
    run:
      config: Debug
    archive:
      config: Release

  Voicey-iOS-Integration:
    build:
      targets:
        VoiceyiOSApp: all
        VoiceyCore: all
        VoiceySpeechApple: all
        VoiceyKeyboardExtension: all
    run:
      config: Debug
    archive:
      config: Release
