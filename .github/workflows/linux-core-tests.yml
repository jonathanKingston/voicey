# Runs SwiftPM unit tests for the Foundation-only VoiceyCore module on Ubuntu.
# The full Voicey app is not built here (Apple frameworks); see build.yml on macOS.
name: Linux core tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: linux-core-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  voicey-core-tests:
    name: VoiceyCore (SwiftPM / Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust toolchain (protocol fixture generation)
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Generate protocol fixtures
        run: cargo run -p voicey-protocol --bin gen-fixtures

      # Held at v2: v3 installs via Swiftly and verifies its download with gpg, which
      # fails on the runner with "Can't check signature: No public key". The only escape
      # hatch v3 offers is `skip-verify-signature: true`, and skipping signature
      # verification on a toolchain download is not a trade worth making. v3 also still
      # targets Node 20, so the bump buys nothing here.
      - name: Swift toolchain
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "5.10"

      - name: Run VoiceyCore tests (incl. protocol fixtures)
        run: swift test --filter VoiceyCoreTests
