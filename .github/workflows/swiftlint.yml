# Fails the build when SwiftLint reports issues (strict mode: warnings are errors).
# Same first-party scope as `.swiftlint.yml` (excludes `.build` checkouts).
name: SwiftLint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swiftlint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: "0.58.2"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux.zip" -o /tmp/swiftlint.zip
          unzip -q -o /tmp/swiftlint.zip swiftlint -d /tmp
          chmod +x /tmp/swiftlint
          sudo mv /tmp/swiftlint /usr/local/bin/swiftlint
          swiftlint version

      - name: Lint
        run: swiftlint lint --strict
