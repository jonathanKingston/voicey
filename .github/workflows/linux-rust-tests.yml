# Rust worker CI on Ubuntu: protocol tests, worker builds, and benchmark script checks.
# macOS-only paths (Swift infer worker, CoreAudio) stay in build.yml.
#
# Tier 1 (`rust-core`): fast PR signal — protocol, voicey-text postprocess tests,
# in-process supervisor mapping tests, stub integration, capture IPC, worker builds,
# benchmark script smoke.
# Tier 2 (`rust-workspace`): full workspace `cargo test` + clippy (ALSA, all crates).
name: Linux Rust tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: linux-rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0

      - name: Generate protocol fixtures
        run: cargo run -p voicey-protocol --bin gen-fixtures

      - name: Protocol contract tests
        run: cargo test -p voicey-protocol

      - name: Text postprocess unit tests (voicey-text)
        run: cargo test -p voicey-text

      - name: Supervisor in-process mapping tests (no child processes)
        run: cargo test -p voicey-supervisor --bin voicey-supervisor

      - name: Install ALSA build dependencies (capture worker)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Supervisor integration tests (stub workers)
        run: |
          cargo build -p voicey-worker-stubs --bins
          cargo test -p voicey-supervisor --test supervisor_integration

      - name: Capture worker IPC tests (fixture path, no microphone)
        run: cargo test -p voicey-capture --test capture_ipc

      - name: Build supervisor and fetch workers
        run: cargo build -p voicey-supervisor -p voicey-fetch

      - name: Benchmark harness script tests
        run: |
          python3 scripts/test_common_voice_benchmark.py
          python3 scripts/test_prepare_common_voice.py

  rust-workspace:
    name: Rust workspace (Tier 2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ALSA build dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          components: clippy

      - name: Generate protocol fixtures
        run: cargo run -p voicey-protocol --bin gen-fixtures

      - name: Build test worker stubs
        run: cargo build -p voicey-worker-stubs --bins

      - name: Workspace unit tests
        run: cargo test --workspace

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --tests -- -D warnings
