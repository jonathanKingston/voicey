version: 2

# Three ecosystems are in this repo and all three need coverage:
#   swift          -> Package.swift (app + VoiceyCore)
#   cargo          -> Cargo.toml workspace + crates/* (Rust workers)
#   github-actions -> .github/workflows/*.yml
#
# Swift version updates additionally require `Package.resolved` to be committed
# (it was previously in .gitignore, which left Dependabot with nothing to resolve
# against). Regenerate it with `swift package resolve` when bumping a dependency.
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - swift

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      # Transitive/patch churn lands as one PR; direct majors still get their own.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    ignore:
      # dtolnay/rust-toolchain selects the toolchain BY REF: `@1.86.0` installs Rust
      # 1.86.0. Dependabot reads that ref as an action version and bumps it to the
      # highest-sorting branch in the action repo (249 of them: 1.100.0, nightly,
      # stable, ...). It proposed `@1.100.0` in #228; Rust 1.100.0 does not exist,
      # so `rustup toolchain install` 404s and every Linux job dies in seconds.
      # The toolchain is pinned in `rust-toolchain.toml` — bump it there.
      - dependency-name: dtolnay/rust-toolchain
      # v3 installs via Swiftly and gpg-verifies the download, which fails on the
      # runner with "Can't check signature: No public key" (#227, #228). Its only
      # workaround is `skip-verify-signature: true`. Revisit when v3 fixes the
      # keyring or v4 drops the Swiftly path.
      - dependency-name: swift-actions/setup-swift
        versions:
          - ">=3.0.0"
    groups:
      actions-all:
        patterns:
          - "*"
